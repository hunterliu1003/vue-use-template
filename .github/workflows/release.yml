name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile --filter vue-use-template
        env:
          CYPRESS_INSTALL_BINARY: 0

      - run: pnpm build

      - run: pnpm test:unit

      - run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract this version's notes from CHANGELOG.md
        run: awk -v version="[$GITHUB_REF_NAME]" '/^#+ \[/ { if (found) exit; if (index($0, version)) { found = 1; next } } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
